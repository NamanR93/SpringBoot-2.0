spring.application.name=SocialMediaApp

#spring.mvc.apiversion.use.path-segment=0
#spring.mvc.apiversion.use.query-parameter=version
#spring.mvc.apiversion.use.header=X-API-VERSION
#spring.mvc.apiversion.use.media-type-parameter[application/json]=version

# for H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

## for SQL
#spring.datasource.url=jdbc:mysql://localhost:3306/social-media-database
#spring.datasource.username = social-media-user
#spring.datasource.password = dummypassword

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

## for SQL
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

# Show SQL in logs for confirmation
spring.jpa.show-sql=true

# Security

spring.security.user.name=naman
spring.security.user.password=password